services:
  db:
    image: mysql:8.0
    container_name: smart-grader-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: smart_grader
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"}
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: smart-grader-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"}
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: smart-grader-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      HOST: "0.0.0.0"
      PORT: "8001"
      DATABASE_URL: "mysql+aiomysql://root:1234@db:3306/smart_grader?charset=utf8mb4"
      SYNC_DATABASE_URL: "mysql+pymysql://root:1234@db:3306/smart_grader?charset=utf8mb4"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME}
      OCR_ENGINE: ${OCR_ENGINE}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${ALIBABA_CLOUD_ACCESS_KEY_ID}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET}
      ALIBABA_CLOUD_ENDPOINT: ocr-api.cn-hangzhou.aliyuncs.com
      BAIDU_CLOUD_API_KEY: ${BAIDU_CLOUD_API_KEY}
      BAIDU_CLOUD_SECRET_KEY: ${BAIDU_CLOUD_SECRET_KEY}
      LLM_GRADING_STRATEGY: multimodal
      IMAGE_PIPELINE_STEPS: ""
      DATABASE_POOL_SIZE: "20"
      DATABASE_MAX_OVERFLOW: "30"
      DATABASE_POOL_TIMEOUT: "30"
      DATABASE_POOL_RECYCLE: "3600"
      TASK_MAX_RETRIES: "3"
      TASK_RETRY_BACKOFF: "10"
      TASK_RETRY_BACKOFF_MAX: "600"
    ports:
      - "8001:8001"
    volumes:
      - upload_data:/app/data

  celery_worker:
    build: .
    container_name: smart-grader-celery
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
    environment:
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      DATABASE_URL: "mysql+aiomysql://root:1234@db:3306/smart_grader?charset=utf8mb4"
      SYNC_DATABASE_URL: "mysql+pymysql://root:1234@db:3306/smart_grader?charset=utf8mb4"
      SECRET_KEY: ${SECRET_KEY}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME}
      OCR_ENGINE: ${OCR_ENGINE}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${ALIBABA_CLOUD_ACCESS_KEY_ID}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET}
      BAIDU_CLOUD_API_KEY: ${BAIDU_CLOUD_API_KEY}
      BAIDU_CLOUD_SECRET_KEY: ${BAIDU_CLOUD_SECRET_KEY}
      LLM_GRADING_STRATEGY: multimodal
      IMAGE_PIPELINE_STEPS: ""
    command:
      - celery
      - -A
      - core.celery_app
      - worker
      - --loglevel=info
      - --concurrency=4
    volumes:
      - upload_data:/app/data

  frontend:
    build:
      context: ./SmartGrader-Frontend
    container_name: smart-grader-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:
  upload_data:
